name: 🔨 Build Pentesting Kernel — rubyx

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'crDroid kernel branch (16.0 / 15.0 / 14.0 / 13.0)'
        required: true
        default: '16.0'
      create_release:
        description: 'Create a GitHub Release from this build'
        type: boolean
        default: false

env:
  TZ: UTC

jobs:
  build:
    name: Pentest Kernel — rubyx
    runs-on: ubuntu-22.04

    steps:

      # ─────────────────────────────────────────────────────────
      # 1. Checkout this repo (holds our configs & anykernel.sh)
      # ─────────────────────────────────────────────────────────
      - name: 📦 Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────
      # 2. Host build dependencies + Clang 18 via LLVM apt repo
      #    Using apt.llvm.org — the official source, always up,
      #    no wget-to-GitHub-release that can 404.
      # ─────────────────────────────────────────────────────────
      - name: 🛠️ Install build deps + Clang 18
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            git zip unzip wget curl python3 python-is-python3 \
            libncurses-dev lz4 zstd cpio rsync ca-certificates \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

          # Install Clang 18 from LLVM's official apt repo
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 18
          sudo apt-get install -y \
            clang-18 lld-18 llvm-18 \
            clang-tools-18 llvm-18-dev

          # Create unversioned symlinks so the build system finds them
          for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                      llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            sudo ln -sf /usr/bin/${tool}-18 /usr/local/bin/${tool}
          done

          echo "Toolchain ready:"
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      # ─────────────────────────────────────────────────────────
      # 5. Clone kernel source
      # ─────────────────────────────────────────────────────────
      - name: 📥 Clone kernel source
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch || '16.0' }}"
          echo "KERNEL_BRANCH=${BRANCH}" >> $GITHUB_ENV
          git clone -q --depth=1 \
            --branch "${BRANCH}" \
            https://github.com/crdroidandroid/android_kernel_xiaomi_mt6877.git \
            kernel
          echo "Cloned branch: ${BRANCH}"
          make -C kernel kernelversion

      # ─────────────────────────────────────────────────────────
      # 5a. Integrate KernelSU Next (non-GKI / legacy mode)
      #     This patches fs/ with KSU hooks and adds drivers/kernelsu/
      # ─────────────────────────────────────────────────────────
      - name: 🔑 Integrate KernelSU Next
        run: |
          cd kernel
          # Use KernelSU-Next's setup script — targets the 'next' branch
          # which supports non-GKI (legacy) kernels like this 4.19 tree
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s
          echo "KernelSU-Next files:"
          ls KernelSU-Next/

          # (API compat fixes handled in the dedicated compat step below)

      # ─────────────────────────────────────────────────────────
      # 5a-2. Patch KernelSU Next for kernel 4.19 API compat
      #   file_wrapper.c uses three 5.x-only APIs:
      #   • iopoll         — added to file_operations in 5.1
      #   • remap_file_range — different signature from 4.19's dedupe_file_range
      #   • REMAP_FILE_DEDUP — flag added in 5.x
      # ─────────────────────────────────────────────────────────
      - name: 🔧 Patch KernelSU Next for kernel 4.19 API compat
        run: |
          cd kernel
          echo "=== Proactive KSU 4.19 compat fixes ==="

          # ── 1. copy_to_kernel_nofault → probe_kernel_write ──────────
          # copy_to_kernel_nofault was added in 5.8; same signature as 4.19's
          # probe_kernel_write so a straight rename works.
          grep -rl "copy_to_kernel_nofault" drivers/kernelsu/ 2>/dev/null \
            | while read f; do
              sed -i 's/copy_to_kernel_nofault/probe_kernel_write/g' "$f"
              echo "  [fixed] copy_to_kernel_nofault → probe_kernel_write: $f"
            done

          # ── 2. file_wrapper.c: 5.x-only struct file_operations fields ─
          F="drivers/kernelsu/infra/file_wrapper.c"
          if [ -f "$F" ]; then
            # iopoll: added in 5.1 — remove every line that references it
            grep -v "iopoll" "$F" > "${F}.tmp" && mv "${F}.tmp" "$F"
            # remap_file_range: incompatible signature vs 4.19's dedupe_file_range
            grep -v "remap_file_range" "$F" > "${F}.tmp" && mv "${F}.tmp" "$F"
            # REMAP_FILE_DEDUP: flag added in 5.x — zero it (branch becomes dead code)
            sed -i 's/REMAP_FILE_DEDUP/0/g' "$F"
            echo "  [fixed] file_wrapper.c: iopoll / remap_file_range / REMAP_FILE_DEDUP"
          fi

          # ── 3. Broad scan: any remaining 5.x-only symbols across all KSU files ─
          # These are the next most common 4.19 vs 5.x mismatches in KSU Next.
          KSUDIR="drivers/kernelsu"

          # lookup_fast: gained an extra argument in 5.x
          grep -rl "lookup_fast" "$KSUDIR/" 2>/dev/null \
            | while read f; do
              sed -i 's/lookup_fast(\([^,]*\), \([^,]*\), \([^)]*\))/lookup_fast(\1, \2)/g' "$f" \
                && echo "  [fixed] lookup_fast arg count: $f" || true
            done

          # mnt_want_write_file / path_mnt: signature/member changes — suppress
          # by adding -Wno-error=implicit-function-declaration only for KSU Makefile
          for mk in "$KSUDIR/Makefile" "$KSUDIR/Kbuild"; do
            if [ -f "$mk" ]; then
              grep -q "Wno-implicit-function-declaration" "$mk" || \
                echo 'ccflags-y += -Wno-implicit-function-declaration' >> "$mk"
              echo "  [added] -Wno-implicit-function-declaration to $mk"
            fi
          done

          echo "=== KSU compat fixes done ==="

      # ─────────────────────────────────────────────────────────
      # 5b. Integrate SUSFS v2
      #     Patches both the kernel fs/ and KernelSU driver
      # ─────────────────────────────────────────────────────────
      - name: 🛡️ Integrate SUSFS v2
        run: |
          cd kernel

          # Clone the SUSFS patch set (original repo is on GitLab, not GitHub)
          git clone --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

          echo "=== kernel_patches/ ==="
          ls /tmp/susfs4ksu/kernel_patches/
          echo "=== kernel_patches/KernelSU/ ==="
          ls /tmp/susfs4ksu/kernel_patches/KernelSU/ || true

          # Copy new SUSFS files into the kernel tree BEFORE patching.
          # include/ → safe to copy wholesale (all new headers)
          # fs/      → copy ONLY susfs.c (the new implementation file).
          #            DO NOT copy the whole fs/ dir — it contains pre-patched
          #            versions of existing files (e.g. task_mmu.c) that will
          #            overwrite and corrupt our vendor kernel tree.
          echo "=== Files in kernel_patches/fs/ ==="
          find /tmp/susfs4ksu/kernel_patches/fs/ -type f

          cp -rv /tmp/susfs4ksu/kernel_patches/include/* include/
          find /tmp/susfs4ksu/kernel_patches/fs/ -name "susfs.c" \
            -exec cp -v {} fs/ \;
          echo "SUSFS source files copied"

          # Apply kernel-side patch for 4.19.
          # No --fuzz: fuzz caused hunk #1 to apply at the wrong location,
          # inserting SUSFS declarations mid-function and corrupting the file.
          # Let failing hunks fail cleanly; we fix them manually below.
          patch -p1 --forward \
            < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          echo "SUSFS kernel patch applied (partial — fixing failed hunks manually)"

          # Hunk #1 in task_mmu.c and open.c adds #include <linux/susfs.h>.
          # If those files now reference SUSFS symbols but are missing the include,
          # insert it manually after the last existing #include line.
          for f in fs/proc/task_mmu.c fs/open.c; do
            if grep -q "sus_" "$f" 2>/dev/null && \
               ! grep -q "linux/susfs.h" "$f" 2>/dev/null; then
              echo "Manually adding #include <linux/susfs.h> to $f"
              LAST_INC=$(grep -n "^#include" "$f" | tail -1 | cut -d: -f1)
              sed -i "${LAST_INC}a #include <linux/susfs.h>" "$f"
            fi
          done

          # Apply KSU-side SUSFS patch from the KernelSU subdir
          cd KernelSU-Next
          # Apply all patches in the KernelSU directory
          for p in /tmp/susfs4ksu/kernel_patches/KernelSU/*.patch; do
            echo "Applying: $p"
            patch -p1 --forward < "$p" || true
          done

          echo "SUSFS v2 integration done"

      # ─────────────────────────────────────────────────────────
      # 5c. List available defconfigs (so we can debug name issues)
      # ─────────────────────────────────────────────────────────
      - name: 🔍 List available defconfigs
        run: |
          echo "=== arch/arm64/configs/ ==="
          ls kernel/arch/arm64/configs/ | grep -i "ruby\|defconfig" || \
            ls kernel/arch/arm64/configs/

      # ─────────────────────────────────────────────────────────
      # 6. Apply base defconfig + pentesting config fragment
      # ─────────────────────────────────────────────────────────
      - name: 🛡️ Apply pentesting config
        run: |
          cd kernel
          mkdir -p out

          # Base device defconfig — all ruby variants share one defconfig
          make O=out ARCH=arm64 ruby_defconfig

          # Merge our pentesting fragment on top
          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            "$GITHUB_WORKSPACE/pentesting.config"

          # Resolve any newly introduced symbols
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang olddefconfig

          echo "--- Active pentesting options (sanity check) ---"
          grep -E "CONFIG_(MODULES|NETFILTER|NF_TABLES|USB_CONFIGFS|USB_G_HID|CFG80211|MAC80211|RTL|ATH9K|MT7601|MT76|RT2800|WIREGUARD|TUN|PACKET|XFRM|PPP)" \
            out/.config | sort

      # ─────────────────────────────────────────────────────────
      # 7. Build kernel image + modules
      # ─────────────────────────────────────────────────────────
      - name: 🔨 Build kernel
        run: |
          cd kernel

          BUILD_START=$(date +%s)

          # Note: dtbo.img is NOT a kernel make target on MT6877 branch 16.0 —
          # it's produced by the ROM build system separately. Build Image.gz-dtb only.
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz-dtb modules \
            < /dev/null \
            2>&1 | tee build.log

          BUILD_END=$(date +%s)
          ELAPSED=$(( BUILD_END - BUILD_START ))
          echo "Build time: $(( ELAPSED / 60 ))m $(( ELAPSED % 60 ))s"

          # Fail the job if the kernel image wasn't produced
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "::error::Kernel image not found — build failed"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────
      # 7b. Surface the actual compiler errors on failure
      # ─────────────────────────────────────────────────────────
      - name: 🔍 Show build errors
        if: failure()
        run: |
          echo "========================================"
          echo "ERRORS / UNDEFINED REFERENCES"
          echo "========================================"
          grep -n "error:\|undefined reference\|No rule to make\|fatal error\|ld: error" \
            kernel/build.log | tail -60 || true
          echo "========================================"
          echo "LAST 80 LINES OF BUILD LOG"
          echo "========================================"
          tail -80 kernel/build.log || true

      # ─────────────────────────────────────────────────────────
      # 8. Install in-tree modules to staging dir
      # ─────────────────────────────────────────────────────────
      - name: 📦 Collect in-tree modules
        run: |
          mkdir -p /tmp/modules_staging
          make -C kernel O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            INSTALL_MOD_PATH=/tmp/modules_staging \
            INSTALL_MOD_STRIP=1 \
            modules_install
          find /tmp/modules_staging -name "*.ko" | head -20

      # ─────────────────────────────────────────────────────────
      # 9. Build out-of-tree RTL8812AU driver
      #    (Wi-Fi monitor mode + frame injection for external USB adapters)
      # ─────────────────────────────────────────────────────────
      - name: 📡 Build RTL8812AU Wi-Fi injection module
        run: |
          git clone -q --depth=1 \
            https://github.com/aircrack-ng/rtl8812au.git /tmp/rtl8812au

          KVER=$(cat kernel/out/include/generated/utsrelease.h | sed 's/.*"\(.*\)".*/\1/')
          echo "Kernel version: $KVER"

          cd /tmp/rtl8812au
          make -j$(nproc --all) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            KSRC="$GITHUB_WORKSPACE/kernel/out" \
            modules 2>&1 || echo "::warning::RTL8812AU build had errors — check output"

          mkdir -p "$GITHUB_WORKSPACE/extra-modules"
          find . -name "*.ko" -exec cp {} "$GITHUB_WORKSPACE/extra-modules/" \;
          ls "$GITHUB_WORKSPACE/extra-modules/"

      # ─────────────────────────────────────────────────────────
      # 10. Package: AnyKernel3 flashable ZIP
      # ─────────────────────────────────────────────────────────
      - name: 🗜️ Package AnyKernel3 zip
        run: |
          git clone -q --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git /tmp/AnyKernel3

          # Our anykernel.sh (device config)
          cp "$GITHUB_WORKSPACE/anykernel.sh" /tmp/AnyKernel3/anykernel.sh

          # Kernel image (dtbo.img is not produced by this kernel's make — skip it)
          cp kernel/out/arch/arm64/boot/Image.gz-dtb /tmp/AnyKernel3/

          # Modules — system/lib/modules (standard path for most Android 12+ devices)
          MODDIR="/tmp/AnyKernel3/modules/system/lib/modules"
          mkdir -p "$MODDIR"

          # In-tree modules
          find /tmp/modules_staging -name "*.ko" \
            -exec llvm-strip --strip-debug {} \; \
            -exec cp {} "$MODDIR/" \; 2>/dev/null || true

          # Out-of-tree RTL8812AU
          for ko in "$GITHUB_WORKSPACE"/extra-modules/*.ko; do
            [ -f "$ko" ] && \
              llvm-strip --strip-debug "$ko" && \
              cp "$ko" "$MODDIR/"
          done

          echo "Modules included:"
          ls "$MODDIR/" | sort

          # Build zip
          DATE=$(date -u +%Y%m%d-%H%M)
          ZIPNAME="PentestKernel-rubyx-${DATE}-b${{ github.run_number }}.zip"
          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV

          cd /tmp/AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/${ZIPNAME}" . \
            -x ".git/*" "*.md" "*.gitignore"

          echo "Output: ${ZIPNAME} ($(du -sh "$GITHUB_WORKSPACE/${ZIPNAME}" | cut -f1))"

      # ─────────────────────────────────────────────────────────
      # 11. Upload artifact
      # ─────────────────────────────────────────────────────────
      - name: ☁️ Upload artifact
        if: always()   # run even on build failure so we always get build.log
        uses: actions/upload-artifact@v4
        with:
          name: PentestKernel-rubyx-b${{ github.run_number }}
          path: |
            ${{ env.ZIPNAME }}
            kernel/build.log
          retention-days: 30

      # ─────────────────────────────────────────────────────────
      # 12. Optional: create a GitHub Release
      # ─────────────────────────────────────────────────────────
      - name: 🚀 Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pentest-b${{ github.run_number }}
          name: "Pentest Kernel rubyx — Build #${{ github.run_number }}"
          files: ${{ env.ZIPNAME }}
          body: |
            ## 🔐 Pentesting Kernel — Redmi Note 12 Pro+ 5G (rubyx)

            **Source:** `crdroidandroid/android_kernel_xiaomi_mt6877` @ `${{ env.KERNEL_BRANCH }}`

            ### Features
            | Capability | Status |
            |---|---|
            | Full Netfilter / iptables / nftables | ✅ |
            | USB Gadget HID — BadUSB keyboard emulation | ✅ |
            | USB Gadget RNDIS / ECM / NCM (USB networking) | ✅ |
            | Loadable kernel modules (`.ko`) | ✅ |
            | Packet socket / raw capture (`tcpdump`, `hcxdumptool`) | ✅ |
            | TUN/TAP — OpenVPN / WireGuard | ✅ |
            | WireGuard (built-in) | ✅ |
            | IPSec / IKEv2 (XFRM) | ✅ |
            | cfg80211 / mac80211 (Wi-Fi stack) | ✅ |
            | RTL8812AU — external USB Wi-Fi injection | ✅ |
            | Atheros ath9k_htc (AR9271) | ✅ |
            | MT7601U / MT7612U (mt76) | ✅ |
            | RT2800USB (Ralink / Mediatek USB) | ✅ |
            | Bluetooth RFCOMM / HID / BNEP | ✅ |

            ### Flash instructions
            1. Boot into TWRP
            2. Flash the ZIP
            3. Wipe cache / dalvik
            4. Reboot

            > ⚠️ For authorized security testing and educational use only.
